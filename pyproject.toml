[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dl-helper"
version = "1.0.0"
description = "面向 Kaggle 外部训练项目的工具库：严格配置、自动预检、可审计恢复与生命周期服务"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "dl-helper maintainers" }]
dependencies = [
    "torch>=2.4,<2.8",
    "accelerate>=1.6,<2",
    "numpy>=2,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.5,<2",
    "safetensors>=0.5,<1",
    "PyYAML>=6,<7",
    "joblib>=1.4,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "build>=1,<2",
]

[tool.setuptools.packages.find]
include = ["dl_helper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: 慢速端到端/子进程测试（CI 默认跳过）",
]

[tool.coverage.run]
source = ["dl_helper.training"]
omit = ["*/site-packages/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
