# MNIST Kaggle base 配置：显式数据路径与必需的生命周期服务。
# Kaggle 运行预算由库的平台执行策略固定为 660/10，不再配置 runtime。
schema_version: 1
run:
  name: mnist
  id: null  # Kaggle 运行时由模板提供
  output_root: null  # Kaggle 默认 /kaggle/working/dl-helper-runs
  source_revision: null  # 可填 tag/分支/短 SHA；不要求 40 位 SHA
  seed: 42
  tags: {}
experiment:
  data_path: /kaggle/input/mnist-dataset/mnist.npz
  lr: 0.001
training:
  max_epochs: 10
  log_every_steps: 20
backend:
  type: torch
  torch:
    gradient_accumulation_steps: 1
    mixed_precision: auto
    compile: false
    clip_grad_norm: 1.0
    deterministic: strict
    matmul_precision: high
    find_unused_parameters: false
  sklearn: null
distributed:
  num_processes: auto  # Kaggle 使用全部可见 CUDA
selection:
  metric: val/loss
  mode: min
  patience: 5
  min_delta: 0.0
checkpoint:
  every_epochs: 1
  every_optimizer_steps: null
  keep_last: 2
report:
  enabled: true
  curve_sample_limit: 100000
  prediction_sample_limit: 10000
  prediction_splits: [val]
remote:
  type: alist
  host: https://alist.example.com
  base_path: /dl-helper/mnist
  user_secret_key: ALIST_USER
  password_secret_key: ALIST_PWD
  connect_timeout_seconds: 10
  read_timeout_seconds: 60
  max_attempts: 3
  async_upload: false
  failure_policy: required
notifications:
  type: wecom
  corp_id_secret_key: WECOM_CORP_ID
  corp_secret_key: WECOM_CORP_SECRET
  agent_id_secret_key: WECOM_AGENT_ID
  to_user: "@all"
  connect_timeout_seconds: 10
  read_timeout_seconds: 30
  max_attempts: 3
  failure_policy: required
